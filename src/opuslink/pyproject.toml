[project]
name = "opuslink"
version = "0.1.0"
description = "Constant-bitrate Opus audio streaming core: encoder tier table, capacity planner, fixed-frame packet body codec, jitter buffer"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "opuslib-next>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opuslink"]

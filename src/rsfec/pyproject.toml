[project]
name = "rsfec"
version = "0.1.0"
description = "Reed-Solomon erasure-coded file container: pack a file into fixed-size blocks with whole-file FEC and block interleaving"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "reedsolo>=1.7,<2",
]

[project.scripts]
rsfec = "rsfec.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rsfec"]
